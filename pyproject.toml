[project]
name = "mtgdeck"
version = "0.1.0"
description = "Commander deckbuilder for Claude Code: MCP server (Scryfall, EDHREC, Commander Spellbook, Archidekt), skills and a local web GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pillow>=10",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "claude-agent-sdk>=0.2",
    # real terminal for the MPC Autofill tool (its menus need a console): ConPTY on Windows, pty elsewhere
    "pywinpty>=2; sys_platform == 'win32'",
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "segno>=1.6",  # QR code for pairing another device with the sync server
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "inquirerpy>=0.3",  # tests drive the same interactive menu the MPC Autofill tool shows
    "numpy>=1.24",  # synthetic halftone test images
]

[project.scripts]
mtg-mcp = "mtgdeck.mcp_server:main"
mtg-gui = "mtgdeck.gui.app:main"
mtg-sync-server = "mtgdeck.sync.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
