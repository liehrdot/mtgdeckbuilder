[package]
name = "mtgdeck-desktop"
version = "0.1.0"
description = "MTG Deckbuilder – Commander-Decks mit Claude (Desktop-Hülle um das Python-Backend)"
authors = ["liehrdot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mtgdeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
