<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>MTG Deckbuilder</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f9; --side: #ececf2; --panel: #fff; --line: #e2e2ea; --text: #1d1d24; --muted: #6b6b78; --accent: #5b4fd9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121218; --side: #181820; --panel: #1d1d26; --line: #2b2b36; --text: #ececf2; --muted: #9a9aa8; --accent: #8f86f0; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; display: grid; grid-template-columns: 240px 1fr; overflow: hidden; }
    .side { background: var(--side); padding: 18px 14px; display: flex; flex-direction: column; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 8px; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    .sk { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--line), color-mix(in srgb, var(--line) 55%, transparent), var(--line)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    .sk.btn { height: 34px; border-radius: 10px; }
    .sk.w60 { width: 60%; } .sk.w80 { width: 80%; } .sk.w40 { width: 40%; }
    main { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .status { display: flex; align-items: center; gap: 12px; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    .err { display: none; gap: 10px; flex-direction: column; }
    .err h2 { margin: 0; font-size: 17px; }
    pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; color: var(--muted); }
    .row { display: flex; gap: 10px; }
    button { font: inherit; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: transparent; }
    body.failed .skeleton { display: none; } body.failed .err { display: flex; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sk, .dot { animation: none; } }
  </style>
</head>
<body>
  <aside class="side">
    <div class="brand"><img src="icon.png" alt="">MTG Deckbuilder</div>
    <div class="sk btn"></div>
    <div class="sk w60"></div><div class="sk w80"></div><div class="sk w40"></div><div class="sk w60"></div>
    <div style="flex:1"></div>
    <div class="sk w60"></div><div class="sk w40"></div>
  </aside>
  <main>
    <div class="status"><span class="dot" aria-hidden="true"></span><span id="text">Startet …</span></div>
    <div class="skeleton">
      <div class="panel"><div class="sk w40"></div><div class="sk w80"></div><div class="sk w60"></div></div>
      <div class="panel"><div class="sk w40"></div><div class="sk w80"></div><div class="sk w80"></div><div class="sk w60"></div></div>
    </div>
    <div class="panel err" id="err">
      <h2>Der Hintergrunddienst startet nicht</h2>
      <p id="err-text">Die App konnte ihr Backend nicht starten. Das Protokoll unten zeigt, woran es liegt.</p>
      <pre id="log"></pre>
      <div class="row"><button class="primary" id="retry">Nochmal versuchen</button><button id="openlog">Protokollordner öffnen</button></div>
    </div>
  </main>
  <script>
    const t = window.__TAURI__;
    const text = document.getElementById("text");
    const go = (url) => { if (url) location.replace(url); };
    const apply = (s) => {
      if (!s) return;
      if (s.state === "ready" && s.url) return go(s.url);
      if (s.state === "failed") {
        document.body.classList.add("failed");
        text.textContent = s.detail || "Fehler";
        document.getElementById("log").textContent = s.log || "(kein Protokoll)";
      } else if (s.state === "restarting") {
        text.textContent = `Startet neu … (Versuch ${s.attempt + 1})`;
      }
    };
    if (t) {
      t.event.listen("backend-ready", (e) => go(e.payload.url));
      t.event.listen("backend-status", (e) => apply(e.payload));
      t.core.invoke("backend_status").then(apply).catch(() => {});
      document.getElementById("retry").addEventListener("click", () => { document.body.classList.remove("failed"); text.textContent = "Startet …"; t.core.invoke("restart_backend"); });
      document.getElementById("openlog").addEventListener("click", () => t.core.invoke("open_log"));
    }
    setTimeout(() => { if (!document.body.classList.contains("failed")) text.textContent = "Startet … dauert gerade etwas länger (Virenscanner prüft oft den ersten Start)."; }, 15000);
  </script>
</body>
</html>
