# The Windows desktop app: the PyInstaller folder build of the backend (mtgdeck-backend.exe), smoke-tested (starts
# on a free port with a token, answers /api/health, refuses requests without the token, carries skills and the
# Claude CLI), then the Tauri shell around it, self-tested (`--selftest` starts the backend from the shell and
# reads /api/health), and the NSIS installer as the artifact. See docs/plan-desktop-app.md.
name: Desktop

on:
  push:
    branches: ["**"]
    paths: ["src/**", "desktop/**", "pyproject.toml", "uv.lock", ".claude/skills/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras
      - name: Build backend
        run: uv run pyinstaller --noconfirm --clean desktop/sidecar/backend.spec
      - name: Smoke test backend
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "mtgdata"
          $p = Start-Process -FilePath "dist/mtgdeck-backend/mtgdeck-backend.exe" -ArgumentList "--data", $data, "--port", "0", "--token", "auto" -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          $url = $null
          for ($i = 0; $i -lt 120 -and -not $url; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path out.txt) { $m = Select-String -Path out.txt -Pattern '^MTGDECK_URL=(.*)$' | Select-Object -First 1; if ($m) { $url = $m.Matches[0].Groups[1].Value } }
          }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          if (-not $url) { throw "backend printed no MTGDECK_URL" }
          $base = $url.Split('?')[0]
          $health = Invoke-RestMethod "${base}api/health"
          if (-not $health.ok -or -not $health.frozen) { throw "health: $($health | ConvertTo-Json)" }
          $code = 0
          try { Invoke-WebRequest "${base}api/decks" -UseBasicParsing | Out-Null; $code = 200 } catch { $code = $_.Exception.Response.StatusCode.value__ }
          if ($code -ne 401) { throw "without token: expected 401, got $code" }
          $token = $url.Split('=')[1]
          $decks = Invoke-RestMethod "${base}api/decks" -Headers @{ Authorization = "Bearer $token" }
          if (-not $health.skills -or -not $health.claude_cli) { throw "bundle incomplete: $($health | ConvertTo-Json)" }
          Write-Host "decks: $($decks.Count), url: $base"
          Stop-Process -Id $p.Id -Force
          '"backend: {0:N0} MB" -f ((Get-ChildItem dist/mtgdeck-backend -Recurse | Measure-Object Length -Sum).Sum / 1MB)' | Invoke-Expression
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop app
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build --config tauri.nosign.conf.json  # no updater artifacts: the signing key lives only in the release workflow
      - name: Self-test desktop app
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no desktop executable built" }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow -RedirectStandardOutput self.txt -RedirectStandardError selferr.txt
          Get-Content self.txt, selferr.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          Get-ChildItem desktop/src-tauri/target/release/bundle/nsis | ForEach-Object { '"{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB)' | Invoke-Expression }
      - uses: actions/upload-artifact@v4
        with:
          name: mtgdeck-desktop-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
