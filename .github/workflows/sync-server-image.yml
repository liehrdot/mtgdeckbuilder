# Builds the sync server image (amd64 + arm64, for Hetzner CX and CAX) and publishes it to
# ghcr.io/<owner>/mtgdeck-sync on the default branch. Other branches only build and smoke-test it.
# Weekly rebuild: picks up security updates of the Python base image.
name: Sync-Server-Image

on:
  push:
    paths:
      - "src/mtgdeck/sync/**"
      - "src/mtgdeck/jsonstore.py"
      - "src/mtgdeck/http.py"
      - "deploy/sync/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/sync-server-image.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sync-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mtgdeck-sync
      # scheduled runs always use the default branch (their event has no repository data)
      PUBLISH: ${{ github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sync/Dockerfile
          load: true
          tags: mtgdeck-sync:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health, pairing code, data folder)
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name sync -p 8080:8080 -e MTG_SYNC_PUBLIC_URL=https://sync.example.de -v "$PWD/data:/data" mtgdeck-sync:test
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/api/health | grep -q '"service":"mtgdeck-sync"'
          docker exec sync mtg-sync-server pair | grep -q "https://sync.example.de/koppeln#"
          curl -fsS localhost:8080/app/ | grep -q "Am Tisch"
          curl -fsS localhost:8080/app/sw.js | grep -q "amtisch-shell-"
          curl -fsS -o /dev/null localhost:8080/app/vendor/qr-scanner/qr-scanner.min.js
          test -f data/sync.sqlite
          docker rm -f sync

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (amd64 + arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sync-Server des MTG-Deckbuilders
          cache-from: type=gha
          cache-to: type=gha,mode=max
